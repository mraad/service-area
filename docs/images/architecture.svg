<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="960" height="430" fill="#fcfcfb"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>

  <!-- arcgis-win -->
  <rect x="20" y="20" width="280" height="300" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>
  <text x="36" y="46" font-weight="bold" fill="#0b0b0b">arcgis-win (Windows)</text>
  <text x="36" y="64" fill="#52514e">ArcGIS Pro 3.7.3 · Network Analyst</text>
  <rect x="36" y="80" width="248" height="46" rx="5" fill="#fdf0ea" stroke="#eb6834"/>
  <text x="48" y="100" fill="#0b0b0b">01_prepare.py</text>
  <text x="48" y="117" fill="#52514e" font-size="12">dedupe · node · Integrate · Minutes</text>
  <rect x="36" y="138" width="248" height="46" rx="5" fill="#fdf0ea" stroke="#eb6834"/>
  <text x="48" y="158" fill="#0b0b0b">02_build_nd.py</text>
  <text x="48" y="175" fill="#52514e" font-size="12">Streets_ND, end-point connectivity</text>
  <rect x="36" y="196" width="248" height="46" rx="5" fill="#fdf0ea" stroke="#eb6834"/>
  <text x="48" y="216" fill="#0b0b0b">03_solve_arcpy.py</text>
  <text x="48" y="233" fill="#52514e" font-size="12">service areas 1 / 5 / 10 min, High</text>
  <text x="36" y="268" fill="#52514e" font-size="12">Input: OhioTGN.gdb</text>
  <text x="36" y="285" fill="#52514e" font-size="12">Adams_Streets, Adams_Crashes</text>
  <text x="36" y="302" fill="#52514e" font-size="12">EPSG:3735 (US survey feet)</text>

  <!-- Parquet handoff -->
  <line x1="300" y1="170" x2="372" y2="170" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="306" y="160" fill="#52514e" font-size="12">Parquet</text>
  <text x="306" y="190" fill="#52514e" font-size="11">edges,</text>
  <text x="306" y="204" fill="#52514e" font-size="11">crashes,</text>
  <text x="306" y="218" fill="#52514e" font-size="11">esri_*</text>

  <!-- gpu-x86 -->
  <rect x="376" y="20" width="300" height="300" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <text x="392" y="46" font-weight="bold" fill="#0b0b0b">gpu-x86 (Linux)</text>
  <text x="392" y="64" fill="#52514e">RTX PRO 6000 Blackwell · CUDA 13.2 · CuPy</text>
  <rect x="392" y="80" width="268" height="46" rx="5" fill="#eaf2fc" stroke="#2a78d6"/>
  <text x="404" y="100" fill="#0b0b0b">engine.py</text>
  <text x="404" y="117" fill="#52514e" font-size="12">CSR graph · SSSP kernel · reached intervals</text>
  <rect x="392" y="138" width="268" height="46" rx="5" fill="#eaf2fc" stroke="#2a78d6"/>
  <text x="404" y="158" fill="#0b0b0b">polygons.py</text>
  <text x="404" y="175" fill="#52514e" font-size="12">shared polygon builder (CPU)</text>
  <rect x="392" y="196" width="128" height="46" rx="5" fill="#eaf2fc" stroke="#2a78d6"/>
  <text x="404" y="216" fill="#0b0b0b">batch.py</text>
  <text x="404" y="233" fill="#52514e" font-size="12">all crashes</text>
  <rect x="532" y="196" width="128" height="46" rx="5" fill="#eaf2fc" stroke="#2a78d6"/>
  <text x="544" y="216" fill="#0b0b0b">server.py</text>
  <text x="544" y="233" fill="#52514e" font-size="12">GET /sa (live)</text>
  <rect x="392" y="254" width="268" height="46" rx="5" fill="#f3f3f1" stroke="#52514e"/>
  <text x="404" y="274" fill="#0b0b0b">parity/compare.py</text>
  <text x="404" y="291" fill="#52514e" font-size="12">lines exact · polygon gate · report</text>

  <!-- Mac -->
  <rect x="752" y="140" width="190" height="180" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="2"/>
  <text x="768" y="166" font-weight="bold" fill="#0b0b0b">Mac (browser)</text>
  <text x="768" y="186" fill="#52514e" font-size="12">web/index.html</text>
  <text x="768" y="203" fill="#52514e" font-size="12">ArcGIS Maps SDK 5.2.2</text>
  <text x="768" y="220" fill="#52514e" font-size="12">hover or click</text>
  <text x="768" y="237" fill="#52514e" font-size="12">1 / 5 / 10 min</text>
  <line x1="752" y1="219" x2="664" y2="219" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="684" y="262" fill="#52514e" font-size="11">ssh -L 8765</text>
  <text x="684" y="276" fill="#52514e" font-size="11">GeoJSON</text>

  <!-- legend -->
  <rect x="20" y="350" width="920" height="62" rx="6" fill="#ffffff" stroke="#d9d8d4"/>
  <rect x="36" y="368" width="14" height="14" fill="#fdf0ea" stroke="#eb6834"/>
  <text x="58" y="380" fill="#0b0b0b">ArcGIS reference engine (ArcPy)</text>
  <rect x="300" y="368" width="14" height="14" fill="#eaf2fc" stroke="#2a78d6"/>
  <text x="322" y="380" fill="#0b0b0b">CUDA engine</text>
  <rect x="450" y="368" width="14" height="14" fill="#f3f3f1" stroke="#52514e"/>
  <text x="472" y="380" fill="#0b0b0b">Parity check</text>
  <text x="36" y="400" fill="#52514e" font-size="12">Both engines read the same noded edge table. Connectivity is identical by construction.</text>
</svg>
